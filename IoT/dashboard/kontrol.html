<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontrol LED IoT</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 { font-size: 1.5rem; margin: 0; }
    h2 { font-size: 1rem; margin: 0 0 12px; color: #334155; }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      background: #94a3b8;
    }
    .badge.ok  { background: #16a34a; }
    .badge.bad { background: #dc2626; }
    .badge.on  { background: #16a34a; }
    .badge.off { background: #64748b; }

    .alert {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .alert.show { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
    }

    .stat { text-align: center; }
    .stat .label { font-size: 0.9rem; color: #64748b; margin-bottom: 8px; }
    .stat .value { font-size: 2.6rem; font-weight: 700; line-height: 1.1; }
    .stat .unit { font-size: 1.2rem; color: #64748b; font-weight: 500; }
    .stat .badge { font-size: 1.3rem; padding: 8px 28px; }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.05s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-mode { background: #e2e8f0; color: #334155; }
    .btn-mode.active { background: #2563eb; color: #fff; }
    .btn-on  { background: #16a34a; color: #fff; }
    .btn-off { background: #dc2626; color: #fff; }

    .info { color: #64748b; font-size: 0.9rem; margin: 6px 0; }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .repo-link:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Kontrol LED ESP32</h1>
      <span id="koneksi" class="badge">Menghubungkan...</span>
    </header>

    <div id="alertBox" class="alert"></div>

    <div class="grid">
      <div class="card stat">
        <div class="label">Suhu</div>
        <div class="value"><span id="suhu">--</span><span class="unit"> &deg;C</span></div>
      </div>
      <div class="card stat">
        <div class="label">Kelembapan</div>
        <div class="value"><span id="kelembapan">--</span><span class="unit"> %</span></div>
      </div>
      <div class="card stat">
        <div class="label">Status LED (dilaporkan ESP32)</div>
        <div><span id="statusLed" class="badge">--</span></div>
      </div>
    </div>

    <div class="card">
      <h2>Mode</h2>
      <div class="btn-row">
        <button id="btnManual" class="btn-mode">Manual</button>
        <button id="btnOtomatis" class="btn-mode">Otomatis (suhu &gt; 30 &deg;C)</button>
      </div>

      <h2>Kontrol LED (mode manual)</h2>
      <div class="btn-row" style="margin-bottom:0">
        <button id="btnOn" class="btn-on">ON</button>
        <button id="btnOff" class="btn-off">OFF</button>
      </div>
    </div>

    <p class="info">Perintah tersimpan: <span id="perintah">-</span></p>
    <p class="info">Terakhir diperbarui: <span id="waktuUpdate">-</span></p>

    <a class="repo-link" href="http://192.168.1.8/IoT/" target="_blank" rel="noopener noreferrer">
      Buka Proyek di Jaringan
    </a>
  </div>

  <script>
    const API_KONTROL = "../api/kontrol.php";
    const API_SENSOR = "../api/terbaru.php";

    const $ = (id) => document.getElementById(id);

    function setKoneksi(ok) {
      $("koneksi").textContent = ok ? "Terhubung" : "Terputus";
      $("koneksi").className = "badge " + (ok ? "ok" : "bad");
    }

    function tampilkanError(msg) {
      $("alertBox").textContent = msg;
      $("alertBox").classList.add("show");
    }

    function sembunyikanError() {
      $("alertBox").classList.remove("show");
    }

    function tampilkanKontrol(d) {
      $("statusLed").textContent = d.status_led;
      $("statusLed").className = "badge " + (d.status_led === "ON" ? "on" : "off");
      $("perintah").textContent = d.perintah + " (mode " + d.mode + ")";

      const otomatis = d.mode === "otomatis";
      $("btnManual").classList.toggle("active", !otomatis);
      $("btnOtomatis").classList.toggle("active", otomatis);
      $("btnOn").disabled = otomatis;
      $("btnOff").disabled = otomatis;
    }

    async function kirimKontrol(payload) {
      try {
        const res = await fetch(API_KONTROL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const json = await res.json();
        tampilkanKontrol(json.data);
        sembunyikanError();
      } catch (err) {
        tampilkanError("Gagal mengirim perintah: " + err.message);
      }
    }

    async function perbarui() {
      try {
        const [rk, rs] = await Promise.all([
          fetch(API_KONTROL, { cache: "no-store" }),
          fetch(API_SENSOR, { cache: "no-store" })
        ]);
        if (!rk.ok || !rs.ok) throw new Error("Server error");

        const k = await rk.json();
        const s = await rs.json();

        tampilkanKontrol(k.data);
        if (s.status === "success") {
          $("suhu").textContent = Number(s.data.suhu).toFixed(1);
          $("kelembapan").textContent = Number(s.data.kelembapan).toFixed(1);
        }
        $("waktuUpdate").textContent = new Date().toLocaleString("id-ID");
        sembunyikanError();
        setKoneksi(true);
      } catch (err) {
        setKoneksi(false);
        tampilkanError("Gagal mengambil data: " + err.message);
      }
    }

    $("btnOn").onclick = () => kirimKontrol({ perintah: "ON" });
    $("btnOff").onclick = () => kirimKontrol({ perintah: "OFF" });
    $("btnManual").onclick = () => kirimKontrol({ mode: "manual" });
    $("btnOtomatis").onclick = () => kirimKontrol({ mode: "otomatis" });

    perbarui();
    setInterval(perbarui, 2000);
  </script>
</body>
</html>
